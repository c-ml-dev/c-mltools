[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mltools"
version = "0.1.0"
description = "Personal toolkit for comparing, tuning, and evaluating ML models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
tuning = ["optuna>=3.0"]
boost = ["xgboost>=1.7", "lightgbm>=4.0"]
all = ["optuna>=3.0", "xgboost>=1.7", "lightgbm>=4.0"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
